<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#aeb1b5">
    <meta name="robots" content="noindex, follow">
    <base href="/">
    <title>Page Not Found | Songaveler</title>
    <link rel="icon" href="./assets/icon.png" type="image/png" sizes="150x150">
    <link rel="apple-touch-icon" href="./assets/icon.png">
    <script src="./js/settings-bootstrap.js?v=bootstrap-1"></script>
    <script src="./js/settings.js?v=appearance-17" defer></script>
    <script src="./js/navigation.js?v=nav-6" defer></script>
    <link rel="stylesheet" href="./css/styles.css?v=appearance-10">
    <link rel="stylesheet" href="./css/theme.css?v=paper-19">
    <link rel="stylesheet" href="./css/site.css?v=site-6">
</head>

<body class="home-page not-found-page" data-page="not-found">
    <main id="main-content" class="page-shell home-shell">
        <div class="card content-card title-card">
            <div class="panel-content">
                <h1 class="page-heading">
                    <img class="page-logo" src="./assets/icon.png" alt="" width="75" height="75">
                    <span class="accent-cyan">4</span><span class="accent-pink">0</span><span class="accent-yellow">4</span>
                </h1>
            </div>
        </div>

        <section class="card content-card intro-card home-hero" aria-labelledby="not-found-heading">
            <div class="panel-content">
                <span class="section-tag">Page not found</span>
                <h2 id="not-found-heading" class="section-heading">
                    This route leads <span class="accent-pink">nowhere.</span>
                </h2>
                <p class="page-intro">
                    The address may be incorrect, or the page may have moved. Head home or choose two artists
                    to start a new Songaveler route.
                </p>
                <div class="home-actions">
                    <a class="primary-button" href="./">Go home</a>
                    <a class="secondary-button" href="./route-picker">Pick a route</a>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
