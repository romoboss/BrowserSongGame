<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#aeb1b5">
    <title>Songaveler Challenge</title>
    <link rel="icon" href="./assets/icon.png" type="image/png" sizes="150x150">
    <link rel="apple-touch-icon" href="./assets/icon.png">
    <script src="./settings.js?v=appearance-16"></script>
    <link rel="stylesheet" href="./styles.css?v=appearance-10">
    <link rel="stylesheet" href="./theme.css?v=paper-17">
    <link rel="stylesheet" href="./site.css?v=site-5">
    <script src="./navigation.js?v=nav-4" defer></script>
</head>
<body class="game-page" data-page="game">
    <main class="page-shell wide-shell">
        <div class="card content-card title-card">
            <div class="panel-content">
                <h1 class="page-heading"><img class="page-logo" src="./assets/icon.png" alt="" width="75" height="75"><span class="accent-cyan">Song</span><span class="accent-pink">aveler</span></h1>
            </div>
        </div>

        <div class="card content-card challenge-card" role="region" aria-label="Challenge">
            <div class="challenge-endpoint">
                <span class="challenge-label">Start</span>
                <strong id="start-artist" class="challenge-name">Loading...</strong>
            </div>
            <div class="challenge-arrow" aria-hidden="true">
                <img src="./assets/arrow.png" alt="">
            </div>
            <div class="challenge-endpoint">
                <span class="challenge-label">Target</span>
                <strong id="target-artist" class="challenge-name">Loading...</strong>
            </div>
        </div>

        <div class="card content-card game-card">
            <div class="game-meta">
                <div class="current-artist">
                    <span class="current-artist-label">Current artist</span>
                    <div id="artist">Loading...</div>
                </div>
                <div class="game-counters" aria-label="Game progress">
                    <span id="move-count">0 moves</span>
                    <time id="timer">00:00</time>
                </div>
            </div>

            <div class="autocomplete">
                <label class="visually-hidden" for="search">Find one of this artist's songs</label>
                <div class="search-box">
                    <img class="search-icon" src="./assets/magnifier.png" alt="">
                    <input
                        id="search"
                        type="search"
                        placeholder="Search songs"
                        autocomplete="off"
                        role="combobox"
                        aria-autocomplete="list"
                        aria-controls="song-suggestions"
                        aria-expanded="false"
                    >
                </div>
                <div id="song-suggestions" class="suggestions" role="listbox" hidden></div>
            </div>

            <div class="status-container">
                <p id="status" class="status" role="status" aria-live="polite"></p>
            </div>

            <div class="choice-heading">
                <h2>Move to <span class="accent-pink">artist</span></h2>
            </div>
            <div id="choices"></div>

            <div class="route-preview-heading">
                <span class="section-tag">Route so far</span>
            </div>
            <div class="route-preview-container">
                <ol id="route-preview" class="route-track route-preview" aria-label="Route so far"></ol>
            </div>
        </div>

        <div class="card content-card game-actions-card">
            <div class="game-actions">
                <button id="restart-challenge" class="primary-button" type="button">
                    Restart challenge
                </button>
                <a class="secondary-button" href="./route-picker">
                    New challenge
                </a>
            </div>
        </div>
    </main>

    <script src="./database.js?v=20260715T200355"></script>
    <script src="./game.js?v=flow-8"></script>
</body>
</html>
